name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check broken links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/mlc-config.json'
        continue-on-error: true     # 链接挂掉不阻塞，但会 warn

  yaml-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML files
        run: |
          pip install pyyaml
          python -c "
          import yaml, glob, sys
          ok = True
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'OK   {f}')
              except yaml.YAMLError as e:
                  print(f'FAIL {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "
